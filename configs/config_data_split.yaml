# Primary controlled protocol. RM prompts are globally disjoint from every PPO
# train/validation/test prompt.
prompt_disjoint_data_split_v1:
  data_split_manifest_path: data/processed/alpaca_farm_prompt_disjoint_v1/manifest.json

# Coste-native replication protocol. This deliberately retains the original
# RM/PPO prompt overlap and must not be described as globally held out.
coste_data_split_v1:
  data_split_manifest_path: data/processed/coste_split_v1/manifest.json
