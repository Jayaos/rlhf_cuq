schema_version: "1.0.0"
name: coste_split_v1
assignment_seed: coste-split-v1-2026-08-24
output_root: data/processed/coste_split_v1
source_manifest: artifacts/source_manifest.json
cross_source_prompt_overlap_policy: allow_coste_native_and_report
original_validation_policy: preserved as external splits

preference:
  asset_name: coste_preference_dataset
  asset_path: assets/coste_preference_dataset
  data_files:
    train:
      - train/human_pref.json
      - train/sft.json
      - train/synth_pref.json
      - train/unlabelled.json
    validation:
      - validation/val.json
  expected_source_counts:
    train: 49383
    validation: 2000
  allocation_source_split: train
  allocations:
    D_rm_train: 90
    D_rm_val: 5
    D_cal: 5
  preserved_splits:
    D_rm_external_val: validation

ppo:
  asset_name: alpaca_farm_prompt_dataset
  asset_path: assets/alpaca_farm_prompt_dataset
  dataset_config: alpaca_instructions
  data_files:
    unlabeled:
      - alpaca_instructions/unlabeled.json
    val:
      - alpaca_instructions/val.json
  expected_source_counts:
    unlabeled: 20001
    val: 2000
  allocation_source_split: unlabeled
  allocations:
    D_rl_train_prompts: 80
    D_rl_val_prompts: 10
    D_rl_test_prompts: 10
  preserved_splits:
    D_rl_external_val: val
