# Additive local-asset overlay. Merge this after the immutable Coste
# rm-pythia-44m entry so only the model and dataset locations change.
rm-pythia-44m-cluster:
  model_name: assets/proxy_rm_sft_base
  model_family: pythia
  datasets:
    - custom_hf_pref:
        dataset_path: assets/coste_preference_dataset

# Primary controlled adaptation: use the globally prompt-disjoint manifest.
# Invoke trainer_rm_manifest.py with this overlay.
rm-pythia-44m-cluster-split:
  model_name: assets/proxy_rm_sft_base
  model_family: pythia
  output_dir: models/rm-pythia-44m-prompt-disjoint
  data_split_manifest_path: data/processed/alpaca_farm_prompt_disjoint_v1/manifest.json
  rm_label_noise_rate: 0.0
  rm_label_noise_seed: 0

# Non-scientific GPU pipeline check: 512 deterministic training pairs produce
# 16 optimizer steps with the inherited batch-size 8 / accumulation 4 setup.
rm-pythia-44m-cluster-smoke:
  model_name: assets/proxy_rm_sft_base
  model_family: pythia
  output_dir: models/rm-pythia-44m-prompt-disjoint-smoke
  data_split_manifest_path: data/processed/alpaca_farm_prompt_disjoint_v1/manifest.json
  rm_label_noise_rate: 0.0
  rm_label_noise_seed: 0
  datasets:
    - custom_hf_pref:
        size: 512
  eval_size: 128
  num_train_epochs: 1
  warmup_steps: 2
  logging_steps: 1
  eval_steps: 8
  save_strategy: "no"

# Hardware-compatible delta for a fast queue smoke on V100/RTX6000/other GPUs.
# Merge after rm-pythia-44m-cluster-smoke. This output is valid only for the
# opt-in one-update PPO integration smoke, never for full/reportable PPO.
rm-pythia-44m-cluster-smoke-fp16:
  output_dir: models/rm-pythia-44m-prompt-disjoint-smoke-fp16
  dtype: fp16
  use_flash_attention: false

# Coste-native replication only: its RM and PPO source families share prompts.
rm-pythia-44m-cluster-coste-native-split:
  model_name: assets/proxy_rm_sft_base
  model_family: pythia
  output_dir: models/rm-pythia-44m-coste-native
  data_split_manifest_path: data/processed/coste_split_v1/manifest.json

# Additive matched-capacity ablation. Merge this after the immutable Coste
# rm-pythia-44m entry to retain its RM loss, learning rate, five epochs, and
# effective batch size 32 while branching the 1.4B SFT policy into a separate
# scalar reward model. The smaller microbatches are memory-only adaptations.
rm-pythia-1p4b-cluster-split:
  model_name: assets/initial_sft_policy
  model_family: pythia
  output_dir: models/rm-pythia-1p4b-prompt-disjoint
  data_split_manifest_path: data/processed/alpaca_farm_prompt_disjoint_v1/manifest.json
  rm_label_noise_rate: 0.0
  rm_label_noise_seed: 0
  gradient_checkpointing: true
  gradient_accumulation_steps: 32
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  eval_accumulation_steps: 1
  reward_normalization_batch_size: 1

# Real-model integration smoke for the 1.4B conversion/training/save path.
# This reduced-data checkpoint is never valid for scientific policy training.
rm-pythia-1p4b-cluster-smoke:
  model_name: assets/initial_sft_policy
  model_family: pythia
  output_dir: models/rm-pythia-1p4b-prompt-disjoint-smoke
  data_split_manifest_path: data/processed/alpaca_farm_prompt_disjoint_v1/manifest.json
  rm_label_noise_rate: 0.0
  rm_label_noise_seed: 0
  datasets:
    - custom_hf_pref:
        size: 8
  eval_size: 8
  gradient_checkpointing: true
  gradient_accumulation_steps: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  eval_accumulation_steps: 1
  reward_normalization_batch_size: 1
  num_train_epochs: 1
  warmup_steps: 1
  logging_steps: 1
  eval_steps: 2
  save_strategy: "no"
