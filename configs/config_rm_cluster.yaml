# Additive local-asset overlay. Merge this after the immutable Coste
# rm-pythia-44m entry so only the model and dataset locations change.
rm-pythia-44m-cluster:
  model_name: assets/proxy_rm_sft_base
  model_family: pythia
  datasets:
    - custom_hf_pref:
        dataset_path: assets/coste_preference_dataset

# Primary controlled adaptation: use the globally prompt-disjoint manifest.
# Invoke trainer_rm_manifest.py with this overlay.
rm-pythia-44m-cluster-split:
  model_name: assets/proxy_rm_sft_base
  model_family: pythia
  output_dir: models/rm-pythia-44m-prompt-disjoint
  data_split_manifest_path: data/processed/alpaca_farm_prompt_disjoint_v1/manifest.json

# Non-scientific GPU pipeline check: 512 deterministic training pairs produce
# 16 optimizer steps with the inherited batch-size 8 / accumulation 4 setup.
rm-pythia-44m-cluster-smoke:
  model_name: assets/proxy_rm_sft_base
  model_family: pythia
  output_dir: models/rm-pythia-44m-prompt-disjoint-smoke
  data_split_manifest_path: data/processed/alpaca_farm_prompt_disjoint_v1/manifest.json
  datasets:
    - custom_hf_pref:
        size: 512
  eval_size: 128
  num_train_epochs: 1
  warmup_steps: 2
  logging_steps: 1
  eval_steps: 8
  save_strategy: "no"

# Hardware-compatible delta for a fast queue smoke on V100/RTX6000/other GPUs.
# Merge after rm-pythia-44m-cluster-smoke; never use this output for PPO.
rm-pythia-44m-cluster-smoke-fp16:
  output_dir: models/rm-pythia-44m-prompt-disjoint-smoke-fp16
  dtype: fp16
  use_flash_attention: false

# Coste-native replication only: its RM and PPO source families share prompts.
rm-pythia-44m-cluster-coste-native-split:
  model_name: assets/proxy_rm_sft_base
  model_family: pythia
  output_dir: models/rm-pythia-44m-coste-native
  data_split_manifest_path: data/processed/coste_split_v1/manifest.json
